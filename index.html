<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10182c"><title>SkillQuest — Rise of the Knight</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eef3ff;background:#0b1120}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#23365e 0%,#0b1120 60%);padding:20px 12px 40px}.app{max-width:720px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:26px;font-weight:900;letter-spacing:.3px}.sub{color:#aab9d3;font-size:13px}.panel{background:#141f36;border:1px solid #34466b;border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 12px 30px #0004}.hero{display:flex;align-items:center;gap:18px}.knight{font-size:75px;filter:drop-shadow(0 0 20px #70baff66)}h1,h2,h3,p{margin:0 0 12px}h1{font-size:25px}h2{font-size:21px}h3{font-size:17px}.muted{color:#b5c3dc}.small{font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.stat{background:#0c162a;border-radius:12px;padding:12px;text-align:center}.stat strong{display:block;font-size:22px;color:#f6d17d}.bar{height:11px;background:#344158;border-radius:20px;overflow:hidden;margin:7px 0 10px}.fill{height:100%;transition:width .25s;background:linear-gradient(90deg,#58a6fa,#90d8ff)}.hp .fill{background:linear-gradient(90deg,#d95768,#ff8e8e)}button{font:inherit;cursor:pointer;border:1px solid #637ca7;background:#213657;color:white;border-radius:12px;padding:13px 16px;font-weight:700}button.primary{background:linear-gradient(120deg,#3976d3,#5a9bff);border-color:#8dbdff;color:white}button:disabled{opacity:.5;cursor:not-allowed}button:hover:not(:disabled){filter:brightness(1.15)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.actions button{width:100%}.question{font-size:19px;font-weight:750;line-height:1.4;margin:18px 0}.answers{display:grid;gap:10px}.answers button{text-align:left;background:#1a2a45}.answers button.good{background:#18503f;border-color:#6dd5a0}.answers button.bad{background:#602a39;border-color:#f48a9b}.feedback{padding:14px;background:#0b162a;border-left:4px solid #e9bf67;border-radius:8px;margin-top:12px;line-height:1.5}.enemy{text-align:center;padding:10px}.enemy .portrait{font-size:86px;display:block;margin:5px}.tag{display:inline-block;padding:5px 10px;background:#293c60;border-radius:20px;font-size:12px;color:#d3e3ff}.log{min-height:40px;color:#e8d39b;margin:10px 0}.hidden{display:none!important}input{width:100%;border:1px solid #647b9e;border-radius:10px;padding:13px;background:#0b1629;color:white;font:inherit;margin:10px 0}.footer{text-align:center;margin-top:20px;color:#8c9bb7;font-size:12px}.pill{color:#9ce9bd}.stage{display:flex;justify-content:space-between;gap:8px;align-items:center}.reset{font-size:12px;padding:8px;background:transparent}.banner{font-size:48px;text-align:center;margin:10px}.summary{padding:14px;background:#0b1629;border-radius:12px;margin:12px 0}.wide{width:100%}@media(max-width:430px){.logo{font-size:22px}.panel{padding:16px}.knight{font-size:58px}.enemy .portrait{font-size:65px}.actions{grid-template-columns:1fr}}
</style></head><body><main class="app"><header class="top"><div><div class="logo">⚔️ SkillQuest</div><div class="sub">Rise of the Knight • AI Fundamentals</div></div><button class="reset" id="reset">New Game</button></header><div id="app"></div><div class="footer">Free personal learning game • Progress saves on this browser</div></main><script>
const KEY='skillquest-knight-v1';const enemies=[{name:'Prompt Goblin',icon:'👺',hp:60,damage:12,questions:3,xp:60,gold:15},{name:'Hallucination Wraith',icon:'👻',hp:80,damage:15,questions:4,xp:90,gold:25},{name:'The Automation Guardian',icon:'🤖',hp:120,damage:18,questions:6,xp:160,gold:50,boss:true}];
const questions=[
{q:'What is a prompt when using an AI assistant?',a:['A computer virus','An instruction or question given to AI','A spreadsheet formula','A type of internet connection'],c:1,e:'A prompt is the instruction, question, or context you give an AI system.'},
{q:'Which prompt is most likely to produce a useful business summary?',a:['Summarize this','Do something with data','Summarize these sales figures in five bullets, highlighting trends and risks','Make it good'],c:2,e:'Specific instructions, context, and an output format make a prompt more useful.'},
{q:'What does it mean when an AI model hallucinates?',a:['It becomes conscious','It produces convincing but incorrect information','It shuts down','It refuses every request'],c:1,e:'AI hallucinations are fabricated or inaccurate outputs that can sound convincing.'},
{q:'What is a sensible way to verify an AI-generated report?',a:['Trust its confident tone','Check key claims against reliable source data','Share it without reading','Ask the same model to promise it is correct'],c:1,e:'Check calculations, important facts, and sources before using AI output for decisions.'},
{q:'Which task is a good candidate for automation?',a:['A repetitive weekly report','A one-time personal conversation','An undefined decision with no rules','A confidential task without approved safeguards'],c:0,e:'Repeatable, well-defined tasks are often strong candidates for automation.'},
{q:'What is a workflow?',a:['A fancy computer monitor','A sequence of steps used to complete a task','A type of password','A chart color'],c:1,e:'A workflow organizes the steps and decisions required to complete a process.'},
{q:'What should you avoid putting into an unapproved public AI tool?',a:['A fictional example','A general math question','Confidential customer information','A public recipe'],c:2,e:'Sensitive company or customer data should only be used with tools approved for that information.'},
{q:'What does human oversight mean in AI-assisted work?',a:['AI always makes final decisions','A person reviews or controls important outputs and decisions','No one checks the results','Only humans can use spreadsheets'],c:1,e:'Human oversight means people remain responsible for checking and directing consequential AI work.'},
{q:'Why is context useful in a prompt?',a:['It helps AI tailor the answer to the task','It guarantees perfect accuracy','It replaces all verification','It makes the internet faster'],c:0,e:'Relevant context helps the model understand the goal, audience, and constraints.'},
{q:'Which tool is commonly used for spreadsheet analysis?',a:['Excel','A paint roller','A camera tripod','A printer cable'],c:0,e:'Excel supports calculations, tables, charts, and analysis of business data.'},
{q:'What is an AI agent generally designed to do?',a:['Only display a static picture','Pursue a goal through steps using tools within its permissions','Replace every manager','Guarantee all outputs are correct'],c:1,e:'An AI agent can plan or execute multiple steps with tools and should operate within defined permissions and oversight.'},
{q:'What is a KPI?',a:['A key performance indicator','A keyboard protection interface','A kind of AI model','A private internet connection'],c:0,e:'KPIs are measurable indicators used to track progress toward business objectives.'},
{q:'Which instruction best reduces ambiguity?',a:['Make a report','Analyze stuff','Compare last month’s expenses to budget and show the three largest variances','You know what I want'],c:2,e:'Clear scope, data, and expected output help reduce ambiguity.'}
];
function fresh(name='Knight'){return {name,level:1,xp:0,gold:0,stage:0,wins:0}}let save;try{save=JSON.parse(localStorage.getItem(KEY))}catch{}let player=save&&typeof save.stage==='number'&&save.stage>=0&&save.stage<=3?save:fresh();let battle=null;let selected=null;let screen='home';const app=document.getElementById('app');function persist(){try{localStorage.setItem(KEY,JSON.stringify(player))}catch{}}function need(){return player.level*100}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function header(){return `<section class="panel hero"><div class="knight">🛡️</div><div style="flex:1"><h2>${safe(player.name)} <span class="tag">Level ${player.level}</span></h2><div class="small muted">Knight of the Knowledge Realm</div><div class="small">XP ${player.xp} / ${need()}</div><div class="bar"><div class="fill" style="width:${Math.min(100,player.xp/need()*100)}%"></div></div></div></section><div class="stats"><div class="stat"><strong>${player.level}</strong><span class="small">Level</span></div><div class="stat"><strong>${player.gold}</strong><span class="small">Gold</span></div><div class="stat"><strong>${player.wins}</strong><span class="small">Wins</span></div></div>`}function renderHome(){screen='home';let completed=player.stage>=enemies.length;app.innerHTML=header()+`<section class="panel"><span class="tag">🌌 Kingdom 1</span><h1 style="margin-top:12px">The Realm of AI Fundamentals</h1><p class="muted">Answer questions to swing your sword. Defeat three enemies to liberate the kingdom.</p><div class="summary">${enemies.map((e,i)=>`<div style="padding:8px 0">${i<player.stage?'✅':i===player.stage?'⚔️':'🔒'} ${e.name} ${i<player.stage?'<span class="pill">Defeated</span>':''}</div>`).join('')}</div>${completed?'<h3>🏆 Kingdom cleared!</h3><p class="muted">You have defeated the Automation Guardian. Replay battles to practice, or await the next kingdom.</p><button class="primary wide" id="replay">Replay the Kingdom</button>':`<button class="primary wide" id="start">⚔️ ${player.stage===0?'Begin Adventure':'Fight '+enemies[player.stage].name}</button>`}</section><section class="panel"><h3>How to play</h3><p class="muted small">Correct answer: 25 damage (35 on a three-answer streak). Wrong answer: enemy strikes. If your health reaches zero, retry the battle. Defeated enemies award XP and gold.</p><button id="rename">Rename Knight</button></section>`;document.getElementById('start')?.addEventListener('click',startBattle);document.getElementById('replay')?.addEventListener('click',()=>{player.stage=0;persist();renderHome()});document.getElementById('rename').onclick=rename}function rename(){app.innerHTML=`<section class="panel"><h2>Name your Knight</h2><label for="heroName">Knight name</label><input id="heroName" maxlength="24" value="${safe(player.name)}"><button class="primary" id="saveName">Save name</button> <button id="back">Back</button></section>`;document.getElementById('saveName').onclick=()=>{player.name=document.getElementById('heroName').value.trim().slice(0,24)||'Knight';persist();renderHome()};document.getElementById('back').onclick=renderHome}function startBattle(){const e=enemies[player.stage];if(!e)return renderHome();battle={enemy:e,hp:100,enemyHp:e.hp,turn:0,streak:0,correct:0,indices:shuffle([...questions.keys()]).slice(0,e.questions),log:'Your knight draws their sword!'};selected=null;renderBattle()}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function renderBattle(){screen='battle';const b=battle,e=b.enemy,q=questions[b.indices[b.turn]];app.innerHTML=`<section class="panel"><div class="stage"><span class="tag">${e.boss?'👑 BOSS BATTLE':'⚔️ ENCOUNTER'}</span><span class="small muted">Question ${b.turn+1} of ${e.questions}</span></div><div class="enemy"><span class="portrait">${e.icon}</span><h2>${e.name}</h2></div><div class="small">Enemy HP: ${Math.max(0,b.enemyHp)} / ${e.hp}</div><div class="bar hp"><div class="fill" style="width:${Math.max(0,b.enemyHp/e.hp*100)}%"></div></div><div class="small">🛡️ ${safe(player.name)} HP: ${Math.max(0,b.hp)} / 100</div><div class="bar"><div class="fill" style="width:${Math.max(0,b.hp)}%"></div></div><div class="small muted">🔥 Streak: ${b.streak} &nbsp; | &nbsp; ⚔️ Correct: ${b.correct}</div><div class="question">${q.q}</div><div class="answers">${q.a.map((a,i)=>`<button data-a="${i}" class="${selected!==null?(i===q.c?'good':i===selected?'bad':''):''}" ${selected!==null?'disabled':''}>${'ABCD'[i]}. ${a}</button>`).join('')}</div>${selected!==null?`<div class="feedback"><strong>${selected===q.c?'✅ Correct!':'❌ Not quite.'}</strong><br>${q.e}<br><br>${b.log}</div><button class="primary wide" id="continue" style="margin-top:12px">Continue →</button>`:''}</section>`;document.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>answer(Number(x.dataset.a)));document.getElementById('continue')?.addEventListener('click',next)}function answer(i){if(selected!==null)return;selected=i;const b=battle,q=questions[b.indices[b.turn]];if(i===q.c){b.streak++;b.correct++;let dmg=b.streak%3===0?35:25;b.enemyHp=Math.max(0,b.enemyHp-dmg);b.log=`⚔️ Your sword deals ${dmg} damage${dmg===35?' — combo strike!':''}`}else{b.streak=0;b.hp=Math.max(0,b.hp-b.enemy.damage);b.log=`💥 ${b.enemy.name} hits you for ${b.enemy.damage} damage.`}renderBattle()}function next(){const b=battle;if(b.enemyHp<=0)return endBattle(true);if(b.hp<=0)return endBattle(false);b.turn++;selected=null;if(b.turn>=b.enemy.questions)return endBattle(false,true);renderBattle()}function endBattle(won,exhausted=false){screen='result';if(won){player.xp+=battle.enemy.xp;player.gold+=battle.enemy.gold;player.wins++;player.stage++;while(player.xp>=need()){player.xp-=need();player.level++}persist()}app.innerHTML=header()+`<section class="panel"><div class="banner">${won?'🏆':'🛡️'}</div><h1 style="text-align:center">${won?'Victory!':exhausted?'The enemy remains standing':'Your Knight has fallen'}</h1><p class="muted" style="text-align:center">${won?'You defeated '+battle.enemy.name+'!':'Review the explanations and try again. Your progress is safe.'}</p><div class="summary">Correct answers: ${battle.correct} / ${battle.turn+1}<br>${won?'Earned: +'+battle.enemy.xp+' XP and +'+battle.enemy.gold+' gold':'Rewards: none this attempt'}</div><button class="primary wide" id="done">${won?'Continue Adventure':'Retry Battle'}</button></section>`;document.getElementById('done').onclick=()=>won?renderHome():startBattle()}
document.getElementById('reset').onclick=()=>{if(confirm('Start a new game? This deletes your saved knight progress.')){player=fresh();persist();renderHome()}};persist();renderHome();
</script></body></html>
