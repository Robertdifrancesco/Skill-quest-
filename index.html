</style></head><body><main id="wrap"><header><strong>⚔️ SkillQuest</strong><span id="stats">Knight · Level 1 · 0 XP · 🪙 0</span></header><section id="gamebox"><canvas id="game" width="960" height="480" aria-label="Side scrolling Knight adventure"></canvas><div id="hud"><div id="hp">❤️ 5 / 5</div><div id="mission">🌲 The Forgotten Path</div></div><div id="toast"></div><div id="overlay"><div class="panel" id="panel"></div></div></section><div id="controls"><div class="cluster"><button class="ctl" id="left" aria-label="Walk left">◀</button><button class="ctl" id="right" aria-label="Walk right">▶</button></div><div class="cluster"><button class="ctl" id="jump" aria-label="Jump">⬆</button><button class="ctl" id="interact" aria-label="Interact">⚔️</button></div></div><div id="hint">Move toward a goblin, then tap ⚔️ to answer a question. Landscape mode recommended.</div></main><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),toastEl=document.getElementById('toast');const W=960,H=480,ground=389,world=2600;let save;try{save=JSON.parse(localStorage.getItem('skillquest-v02')||'{}')}catch{save={}};let xp=Number(save.xp)||0,gold=Number(save.gold)||0,defeated=Array.isArray(save.defeated)?save.defeated:[],stage=Number(save.stage)===2?2:1,hp=5,player={x:90,y:ground-63,w:35,h:63,vy:0,face:1,grounded:true},keys={left:false,right:false},camera=0,mode='intro',current=null,toastTime=0,attackUntil=0,shake=0,frame=0;const levelOneEnemies=[{x:440,name:'Prompt Goblin',id:0,hp:2},{x:1000,name:'Data Goblin',id:1,hp:2},{x:1580,name:'Automation Ogre',id:2,hp:3},{x:2260,name:'The Logic Guardian',id:3,hp:4,boss:true}];const levelTwoEnemies=[{x:410,name:'Shadow Wolf',id:10,hp:3,maxHp:3},{x:930,name:'Riddle Wraith',id:11,hp:3,maxHp:3},{x:1510,name:'Phantom Knight',id:12,hp:4,maxHp:4},{x:2210,name:'Forest Warden',id:13,hp:5,maxHp:5,boss:true}];let enemies=stage===2?levelTwoEnemies:levelOneEnemies;
const forestQuestions=[
{q:'What is a hallucination in generative AI?',a:['A verified source','A confident but incorrect output','A computer virus','An automatic backup'],c:1,why:'An AI hallucination is information that sounds plausible but is false or unsupported.'},
{q:'Which prompt is most likely to produce a useful business summary?',a:['Summarize this','Do something useful','Summarize these sales figures in 3 bullets, noting trends and uncertainties','Make it better'],c:2,why:'Clear instructions, context, output format, and constraints help the model produce useful results.'},
{q:'What is the safest way to handle confidential company data with an AI tool?',a:['Paste it into any public chatbot','Check company policy and approved tools before sharing','Post it in a public forum','Ignore privacy settings'],c:1,why:'Use company-approved tools and follow data handling policies for confidential information.'},
{q:'What does a human-in-the-loop workflow include?',a:['No people involved','A person reviewing or approving important AI outputs','Only handwritten notes','A disconnected computer'],c:1,why:'Human-in-the-loop means a person checks, corrects, or approves parts of an automated process.'},
{q:'Which step should come first when automating a repetitive business task?',a:['Buy expensive software','Map the current process and its exceptions','Delete the source data','Remove all review steps'],c:1,why:'Understand the workflow, inputs, outputs, and exceptions before automating.'},
{q:'What is a useful way to evaluate an AI-generated answer?',a:['Judge only how confident it sounds','Compare it with reliable sources and test examples','Trust it if it is long','Avoid checking calculations'],c:1,why:'Accuracy needs verification with trusted evidence, tests, and checks.'},

w?',a:['Never reviewing outputs','Checking accuracy and handling exceptions','Assuming every answer is right','Ignoring data privacy'],c:1,why:'Human review can catch mistakes, handle edge cases, and protect sensitive information.'},{q:'What is a dashboard commonly used for?',a:['Tracking key information and trends','Installing hardware','Writing passwords publicly','Replacing source data'],c:0,why:'Dashboards summarize important measures so people can spot patterns and make decisions.'}];let qIndex=0;const level=()=>1+Math.floor(xp/100);function store(){try{localStorage.setItem('skillquest-v02',JSON.stringify({xp,gold,defeated,stage}))}catch{};document.getElementById('stats').textContent=`Knight · Level ${level()} · ${xp} XP · 🪙 ${gold}`;document.getElementById('hp').textContent=`❤️ ${hp} / 5`};function show(html){panel.innerHTML=html;overlay.classList.add('show')}function hide(){overlay.classList.remove('show')}function msg(s){toastEl.textContent=s;toastTime=performance.now()+2500}function intro(){if(stage===1&&defeated.includes(3)){stage=2;enemies=levelTwoEnemies;player.x=90;store()}mode='intro';show(`<h2>⚔️ Rise of the Knight</h2><p>Welcome to <b>${stage===2?'The Dark Forest':'The Forgotten Path'}</b>. Walk through the forest and challenge monsters using your AI and data knowledge.</p><p class="small">◀ ▶ Move &nbsp; ⬆ Jump &nbsp; ⚔️ Challenge nearby enemy</p><button class="primary" id="start">Begin Adventure</button>`);document.getElementById('start').onclick=()=>{mode='walk';hide();msg('Find the first goblin!')}}function nearest(){return enemies.find(e=>!defeated.includes(e.id)&&Math.abs(e.x-player.x)<115)}function interact(){if(mode!=='walk')return;const e=nearest();if(e){current=e;mode='question';ask()}else msg('Move closer to an enemy to challenge it!')};function ask(){let q=stage===2?forestQuestions[forestQuestionIndex%forestQuestions.length]:questions[qIndex%questions.length];show(`<h2>⚔️ ${current.name}</h2><p>${q.q}</p><div class="answers">${q.a.map((a,i)=>`<button class="answer" data-choice="${i}">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}</div><p class="small">Correct = sword attack · Wrong = lose 1 heart</p>`);panel.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.choice)))}function answer(choice){const q=stage===2?forestQuestions[forestQuestionIndex++%forestQuestions.length]:questions[qIndex++%questions.length];const correct=choice===q.c;if(correct){current.hp--;attackUntil=performance.now()+700;shake=10}else{hp=Math.max(0,hp-1)}store();const won=current.hp<=0;show(`<h2>${correct?'✨ Correct! Sword Strike!':'🛡️ Not quite!'}</h2><p>${q.why}</p><p>${correct?(won?'Enemy defeated!':'Enemy HP remaining: '+current.hp):'The enemy hit you. You lost 1 heart.'}</p><button class="primary" id="continue">${hp===0?'Recover and Retry':won?'Collect Reward':'Continue Battle'}</button>`);document.getElementById('continue').onclick=()=>{if(hp===0){hp=5;player.x=Math.max(90,current.x-150);mode='walk';hide();store();msg('Healed! Try again.')}else if(won){defeated.push(current.id);xp+=current.boss?100:40;gold+=current.boss?50:15;hp=Math.min(5,hp+1);store();hide();mode='walk';msg(`Victory! +${current.boss?100:40} XP, +${current.boss?50:15} gold`);if(current.boss){mode='victory';if(stage===1){show('<h2>🏆 The Forgotten Path Cleared!</h2><p>You unlocked Level 2: The Dark Forest. New monsters and harder AI trivia await!</p><button class="primary" id="nextlevel">Enter the Dark Forest →</button>');document.getElementById('nextlevel').onclick=()=>{stage=2;enemies=levelTwoEnemies;player.x=90;player.y=ground-player.h;hp=5;store();mode='walk';hide();msg('🌘 Level 2: The Dark Forest!')}}else{show('<h2>🏆 Dark Forest Cleared!</h2><p>You defeated the Forest Warden and completed Level 2. Excellent work, Knight!</p><button class="primary" id="replay">Explore the Forest</button>');document.getElementById('replay').onclick=()=>{mode='walk';hide()}}}}else ask()}}function drawSky(){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,stage===2?'#111027':'#162b48');sky.addColorStop(1,stage===2?'#394660':'#678e8b');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle=stage===2?'#b9c8f8':'#f3dfaa';ctx.beginPath();ctx.arc(785-camera*.04,83,34,0,Math.PI*2);ctx.fill();for(let i=0;i<15;i++){const x=((i*219-camera*.18)%(W+260)+W+260)%(W+260)-100;ctx.fillStyle='#2c5264';ctx.beginPath();ctx.moveTo(x-125,ground);ctx.lineTo(x+15,165+(i%3)*18);ctx.lineTo(x+145,ground);ctx.fill()}for(let i=0;i<25;i++){let x=((i*147-camera*.45)%(W+200)+W+200)%(W+200)-100;const h=90+i%5*17;ctx.fillStyle='#214b49';ctx.fillRect(x,ground-h,15,h);ctx.beginPath();ctx.arc(x+8,ground-h,37+i%3*8,0,Math.PI*2);ctx.fill()}}function drawWorld(){ctx.fillStyle='#435e37';ctx.fillRect(0,ground,W,12);ctx.fillStyle='#423a2e';ctx.fillRect(0,ground+12,W,H-ground-12);for(let i=0;i<95;i++){const x=i*33-camera;if(x< -30||x>W+30)continue;ctx.fillStyle=i%3?'#6e6946':'#91865c';ctx.fillRect(x,ground+20+(i%4)*13,13,5);ctx.fillStyle='#87a75d';ctx.fillRect(x+7,ground-5,3,5)}for(let i=0;i<14;i++){const x=i*190+220-camera;if(x< -100||x>W+100)continue;ctx.fillStyle='#4a392e';ctx.fillRect(x,ground-85,19,85);ctx.fillStyle=stage===2?'#263c4b':'#315b37';for(let j=0;j<3;j++){ctx.beginPath();ctx.arc(x+9+(j-1)*22,ground-93-(j%2)*20,35,0,Math.PI*2);ctx.fill()}}ctx.fillStyle='#d2b77a';ctx.fillRect(2520-camera,ground-110,16,110);ctx.fillStyle='#d2b77a';ctx.fillRect(2510-camera,ground-110,65,12);ctx.fillStyle='#2d405b';ctx.fillRect(2540-camera,ground-90,15,90)}function knight(){const x=player.x-camera,y=player.y;ctx.save();ctx.translate(x+17,y+31);ctx.scale(player.face,1);ctx.translate(-17,-31);ctx.fillStyle='#192338';ctx.fillRect(5,47,12,16);ctx.fillRect(22,47,12,16);ctx.fillStyle='#b8c4d3';ctx.fillRect(4,15,30,36);ctx.fillStyle='#4d83b6';ctx.fillRect(8,20,22,22);ctx.fillStyle='#d9e1e9';ctx.fillRect(7,0,26,21);ctx.fillStyle='#354b62';ctx.fillRect(10,9,20,5);ctx.fillStyle='#d9e1e9';ctx.fillRect(1,22,8,22);ctx.fillRect(31,22,8,22);ctx.fillStyle='#e2b866';ctx.fillRect(17,22,6,19);ctx.fillStyle='#f0f4f8';if(performance.now()<attackUntil){ctx.fillRect(34,-10,7,48);ctx.fillStyle='#ffe0a0';ctx.fillRect(32,21,12,5)}else{ctx.fillRect(34,25,6,36);ctx.fillStyle='#ffe0a0';ctx.fillRect(31,37,12,5)}ctx.restore()}function monster(e){if(defeated.includes(e.id))return;const x=e.x-camera,y=ground-(e.boss?115:56);ctx.fillStyle=e.boss?'#724d88':stage===2?'#465879':'#4c8a58';ctx.fillRect(x,y,e.boss?72:43,e.boss?115:56);ctx.fillStyle=e.boss?'#a88dc4':stage===2?'#889bd2':'#8ac27d';ctx.fillRect(x+7,y-13,e.boss?58:29,27);ctx.fillStyle='#172435';ctx.fillRect(x+12,y-4,7,7);ctx.fillRect(x+(e.boss?47:27),y-4,7,7);ctx.fillStyle='#efdcad';ctx.fillRect(x+10,y+18,6,6);ctx.fillRect(x+(e.boss?52:30),y+18,6,6);ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff2cb';ctx.fillText(e.name,x+(e.boss?36:22),y-23);ctx.fillStyle='#10192b';ctx.fillRect(x,y-20,e.boss?72:43,6);ctx.fillStyle='#e56b65';ctx.fillRect(x,y-20,(e.boss?72:43)*e.hp/(e.maxHp||(e.boss?4:e.id===2?3:2)),6)}function draw(){frame++;camera=Math.max(0,Math.min(world-W,player.x-210));ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.78;if(shake<.3)shake=0}drawSky();drawWorld();enemies.forEach(monster);knight();ctx.restore();if(mode==='walk'){let speed=0;if(keys.left)speed=-4.3;if(keys.right)speed=4.3;if(speed){player.x=Math.max(12,Math.min(world-45,player.x+speed));player.face=Math.sign(speed)}player.vy+=.75;player.y+=player.vy;if(player.y>=ground-player.h){player.y=ground-player.h;player.vy=0;player.grounded=true}const e=nearest();document.getElementById('mission').textContent=e?`⚔️ ${e.name} nearby`:(stage===2?'🌘 The Dark Forest':'🌲 The Forgotten Path')}if(performance.now()>toastTime)toastEl.textContent='';requestAnimationFrame(draw)}function jump(){if(mode==='walk'&&player.grounded){player.vy=-14;player.grounded=false}}function bind(id,down,up){const b=document.getElementById(id);b.addEventListener('contextmenu',ev=>ev.preventDefault());b.addEventListener('selectstart',ev=>ev.preventDefault());b.addEventListener('touchstart',ev=>ev.preventDefault(),{passive:false});b.addEventListener('pointerdown',ev=>{ev.preventDefault();try{b.setPointerCapture(ev.pointerId)}catch{};b.classList.add('pressed');down()});const stop=()=>{b.classList.remove('pressed');if(up)up()};b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('lostpointercapture',stop)}window.addEventListener('blur',()=>{keys.left=false;keys.right=false});document.addEventListener('visibilitychange',()=>{if(document.hidden){keys.left=false;keys.right=false}});bind('left',()=>keys.left=true,()=>keys.left=false);bind('right',()=>keys.right=true,()=>keys.right=false);bind('jump',jump);bind('interact',interact);document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','e','E'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;if((e.key==='ArrowUp'||e.key===' ')&&!e.repeat)jump();if((e.key==='e'||e.key==='E')&&!e.repeat)interact()});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});window.addEventListener('blur',()=>{keys.left=false;keys.right=false});store();intro();requestAnimationFrame(draw)})();
