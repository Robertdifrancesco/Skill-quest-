w?',a:['Never reviewing outputs','Checking accuracy and handling exceptions','Assuming every answer is right','Ignoring data privacy'],c:1,why:'Human review can catch mistakes, handle edge cases, and protect sensitive information.'},{q:'What is a dashboard commonly used for?',a:['Tracking key information and trends','Installing hardware','Writing passwords publicly','Replacing source data'],c:0,why:'Dashboards summarize important measures so people can spot patterns and make decisions.'}];// Scenario-based practice: plausible, similarly sized distractors. Options shuffle every encounter.

d('importSave').onclick=importSave}function enterLevel(n){stage=n;enemies=n===1?levelOneEnemies:levelTwoEnemies;for(const e of enemies){e.hp=e.maxHp||(e.boss?(n===1?4:5):(n===1?(e.id===2?3:2):3));}defeated=defeated.filter(id=>!enemies.some(e=>e.id===id));player.x=90;player.y=ground-player.h;player.vy=0;player.grounded=true;hp=5;current=null;mode='walk';store();hide();msg(n===1?'🌲 The Forgotten Path — replay!':'🌘 The Dark Forest — replay!')}function intro(){menu()}document.getElementById('levelsBtn').onclick=menu;
function exportSave(){

function nearest(){return enemies.find(e=>!defeated.includes(e.id)&&Math.abs(e.x-player.x)<115)}function interact(){if(mode!=='walk')return;const e=nearest();if(e){current=e;mode='question';ask()}else msg('Move closer to an enemy to challenge it!')};function nextQuestion(){const bank=stage===2?forestQuestions:questions;const index=stage===2?forestQuestionIndex++:qIndex++;const q=bank[index%bank.length];const options=q.a.map((label,i)=>({label,correct:i===q.c}));for(let i=options.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]]}return {...q,options}}

  defeated.push(current.id);xp+=current.boss?100:40;gold+=current.boss?50:15;hp=Math.min(5,hp+1);
  store();hide();mode='walk';msg(`Victory! +${current.boss?100:40} XP, +${current.boss?50:15} gold`);

  }

}

ctx.fillStyle='#d2b77a';ctx.fillRect(2520-camera,ground-110,16,110);ctx.fillRect(2510-camera,ground-110,65,12);ctx.fillStyle='#2d405b';ctx.fillRect(2540-camera,ground-90,15,90)}function knight(){const x=player.x-camera,y=player.y;const moving=keys.left||keys.right;const attacking=performance.now()<attackUntil;const pose=attacking?'attackPose':!player.grounded?'jumpPose':moving?(Math.floor(frame/9)%2?'run1':'run2'):'idle';ctx.save();ctx.shadowColor='#18baff';ctx.shadowBlur=attacking?22:5;const drawn=sprite(pose,x-22,ground-108+(player.y-(ground-player.h)),100,108,player.face<0);ctx.restore();if(!drawn){ctx.fillStyle='#a9d7ef';ctx.fillRect(x,y,42,88)}if(attacking){ctx.save();ctx.globalAlpha=.85;const fx=player.face>0?x+35:x-75;sprite('slash',fx,y-35,110,105,player.face<0);ctx.restore()}}function monster(e){if(defeated.includes(e.id))return;const boss=e.boss,x=e.x-camera,y=ground-(boss?140:86);const w=boss?130:84,h=boss?145:90;let kind=boss?'warden':e.id===12||e.id===11||e.id===2?'skeleton':'goblin';ctx.save();ctx.shadowColor=boss?'#12d8ff':'#243c51';ctx.shadowBlur=boss?15:3;const ok=sprite(kind,x-18,y,w,h);ctx.restore();if(!ok){ctx.fillStyle='#568a60';ctx.fillRect(x,y,w,h)}ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff2cb';ctx.shadowColor='#000';ctx.shadowBlur=5;ctx.fillText(e.name,x+w/2-18,y-25);ctx.shadowBlur=0;const barw=boss?96:55;ctx.fillStyle='#10192b';ctx.fillRect(x,y-19,barw,7);ctx.fillStyle='#e56b65';ctx.fillRect(x,y-19,barw*e.hp/(e.maxHp||(boss?4:e.id===2?3:2)),7)}function draw(){frame++;camera=Math.max(0,Math.min(world-W,player.x-210));ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.78;if(shake<.3)shake=0}drawSky();drawWorld();enemies.forEach(monster);knight();ctx.restore();if(mode==='walk'){let speed=0;if(keys.left)speed=-4.3;if(keys.right)speed=4.3;if(speed){player.x=Math.max(12,Math.min(world-45,player.x+speed));player.face=Math.sign(speed)}player.vy+=.75;player.y+=player.vy;if(pl
