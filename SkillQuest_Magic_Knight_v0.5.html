function shuffled(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
let deckOne=[],deckTwo=[];
function makeDeck(raw){return shuffled(raw.map(([q,a,c,why])=>{const choices=shuffled(a.map((text,i)=>({text,correct:i===c})));return {q,a:choices.map(v=>v.text),c:choices.findIndex(v=>v.correct),why}}))}
function shuffleDeck(n){if(n===1)deckOne=makeDeck(improvedOne);else deckTwo=makeDeck(improvedTwo)}
shuffleDeck(1);shuffleDeck(2);
function nextQuestion(){let deck=stage===2?deckTwo:deckOne;let idx=stage===2?forestQuestionIndex:qIndex;if(idx>=deck.length){shuffleDeck(stage);deck=stage===2?deckTwo:deckOne;idx=0;if(stage===2)forestQuestionIndex=0;else qIndex=0}return deck[idx]}
function store(){try{localStorage.setItem('skillquest-v02',JSON.stringify({xp,gold,defeated,stage,completed}))}catch{};document.getElementById('stats').textContent=`Knight · Level ${level()} · ${xp} XP · 🪙 ${gold}`;document.getElementById('hp').textContent=`❤️ ${hp} / 5`};function show(html){panel.innerHTML=html;overlay.classList.add('show')}function hide(){overlay.classList.remove('show')}function msg(s){toastEl.textContent=s;toastTime=performance.now()+2500}function levelMenu(){mode='menu';keys.left=false;keys.right=false;store();show(`<h2>⚔️ Choose Your Level</h2><p>Replay cleared stages for practice. Your XP, gold and unlocked levels stay saved.</p><div id="levelMenu"><button class="levelTile" id="pick1"><b>🌲 Level 1</b><small>The Forgotten Path<br>${completed.includes(1)?'✓ Cleared · Replay':'Ready to play'}</small></button><button class="levelTile" id="pick2" ${completed.includes(1)||stage===2?'':'disabled'}><b>🌘 Level 2</b><small>The Dark Forest<br>${completed.includes(2)?'✓ Cleared · Replay':completed.includes(1)||stage===2?'Unlocked':'🔒 Locked'}</small></button></div><p class="small">More levels will be added in future updates.</p>`);document.getElementById('pick1').onclick=()=>chooseLevel(1);document.getElementById('pick2').onclick=()=>chooseLevel(2)}
function chooseLevel(n){if(n===2&&!completed.includes(1)&&stage!==2)return;stage=n;enemies=(n===1?levelOneEnemies:levelTwoEnemies).map(e=>({...e,hp:e.maxHp||e.hp}));defeated=defeated.filter(id=>!enemies.some(e=>e.id===id));player.x=90;player.y=ground-player.h;player.vy=0;player.grounded=true;hp=5;current=null;forestQuestionIndex=0;qIndex=0;shuffleDeck(n);mode='walk';store();hide();msg('Level '+n+' — challenge the enemies!')}
function intro(){levelMenu()}
function nearest(){return enemies.find(e=>!defeated.includes(e.id)&&Math.abs(e.x-player.x)<115)}function interact(){if(mode!=='walk')return;const e=nearest();if(e){current=e;mode='question';ask()}else msg('Move closer to an enemy to challenge it!')};function ask(){let q=nextQuestion();show(`<h2>⚔️ ${current.name}</h2><p>${q.q}</p><div class="answers">${q.a.map((a,i)=>`<button class="answer" data-choice="${i}">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}</div><p class="small">Correct = sword attack · Wrong = lose 1 heart</p>`);panel.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.choice)))}function answer(choice){const q=nextQuestion();if(stage===2)forestQuestionIndex++;else qIndex++;const correct=choice===q.c;if(correct){current.hp--;attackUntil=performance.now()+700;shake=10}else{hp=Math.max(0,hp-1)}store();const won=current.hp<=0;show(`<h2>${correct?'✨ Correct! Sword Strike!':'🛡️ Not quite!'}</h2><p>${q.why}</p><p>${correct?(won?'Enemy defeated!':'Enemy HP remaining: '+current.hp):'The enemy hit you. You lost 1 heart.'}</p><button class="primary" id="continue">${hp===0?'Recover and Retry':won?'Collect Reward':'Continue Battle'}</button>`);document.getElementById('continue').onclick=()=>{if(hp===0){hp=5;player.x=Math.max(90,current.x-150);mode='walk';hide();store();msg('Healed! Try again.')}else if(won){defeated.push(current.id);xp+=current.boss?100:40;gold+=current.boss?50:15;hp=Math.min(5,hp+1);store();hide();mode='walk';msg(`Victory! +${current.boss?100:40} XP, +${current.boss?50:15} gold`);if(current.boss){mode='victory';if(!completed.includes(stage))completed.push(stage);store();show(`<h2>🏆 Level ${stage} Cleared!</h2><p>${stage===1?'The Forgotten Path':'The Dark Forest'} conquered! Your progress is saved. Replay anytime to practice with fresh questions.</p><button class="primary" id="backlevels">Choose a Level</button>${stage===1?'<button class="primary" id="nextlevel">Enter Level 2 →</button>':''}`);document.getElementById('backlevels').onclick=levelMenu;if(stage===1)document.getElementById('nextlevel').onclick=()=>chooseLevel(2)}}else ask()}}function drawSky(){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,stage===2?'#0b1125':'#142e51');sky.addColorStop(.6,stage===2?'#273653':'#476c81');sky.addColorStop(1,stage===2?'#3a4650':'#75968a');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle=stage===2?'#a8c7ff':'#ffdf9b';ctx.beginPath();ctx.arc(780-camera*.025,75,30,0,Math.PI*2);ctx.fill();for(let i=0;i<14;i++){let x=((i*193-camera*.14)%(W+300)+W+300)%(W+300)-150;ctx.fillStyle=stage===2?'#1a304b':'#35576c';ctx.beginPath();ctx.moveTo(x-145,ground);ctx.lineTo(x+15,170+(i%3)*16);ctx.lineTo(x+155,ground);ctx.fill()}for(let i=0;i<28;i++){let x=((i*115-camera*.34)%(W+250)+W+250)%(W+250)-110;const h=110+(i%4)*19;ctx.fillStyle=stage===2?'#142d38':'#204c50';ctx.fillRect(x,ground-h,12,h);ctx.beginPath();ctx.arc(x+6,ground-h,36+i%3*9,0,Math.PI*2);ctx.fill()}for(let i=0;i<35;i++){const x=(i*271+frame*(stage===2?-.3:.12)-camera*.16)%(W+50);const y=80+(i*83)%290;ctx.fillStyle=stage===2?'#63d9f966':'#c3edca55';ctx.fillRect((x+W+50)%(W+50),y,3,3)}}function drawWorld(){ctx.fillStyle=stage===2?'#2c483e':'#486a3c';ctx.fillRect(0,ground,W,12);ctx.fillStyle='#2b2930';ctx.fillRect(0,ground+12,W,H-ground-12);for(let i=0;i<95;i++){const x=i*33-camera;if(x< -30||x>W+30)continue;ctx.fillStyle=i%3?'#70624e':'#a1936b';ctx.fillRect(x,ground+20+(i%4)*13,13,5);ctx.fillStyle=stage===2?'#6a9b87':'#91b36c';ctx.fillRect(x+7,ground-5,3,5)}for(let i=0;i<14;i++){const x=i*190+220-camera;if(x< -100||x>W+100)continue;ctx.fillStyle='#42382f';ctx.fillRect(x,ground-104,22,104);ctx.fillStyle=stage===2?'#1c3d43':'#2c6547';for(let j=0;j<3;j++){ctx.beginPath();ctx.arc(x+9+(j-1)*24,ground-105-(j%2)*19,37,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#85dcfa';ctx.fillRect(x+9,ground-14,3,4)}ctx.fillStyle='#d2b77a';ctx.fillRect(2520-camera,ground-110,16,110);ctx.fillRect(2510-camera,ground-110,65,12);ctx.fillStyle='#2d405b';ctx.fillRect(2540-camera,ground-90,15,90)}function knight(){const x=player.x-camera,y=player.y;const moving=keys.left||keys.right;const attacking=performance.now()<attackUntil;const pose=attacking?'attackPose':!player.grounded?'jumpPose':moving?(Math.floor(frame/9)%2?'run1':'run2'):'idle';ctx.save();ctx.shadowColor='#18baff';ctx.shadowBlur=attacking?22:5;const drawn=sprite(pose,x-19,y-18,91,112,player.face<0);ctx.restore();if(!drawn){ctx.fillStyle='#a9d7ef';ctx.fillRect(x,y,42,88)}if(attacking){ctx.save();ctx.globalAlpha=.85;const fx=player.face>0?x+35:x-75;sprite('slash',fx,y-35,110,105,player.face<0);ctx.restore()}}function monster(e){if(defeated.includes(e.id))return;const boss=e.boss,x=e.x-camera,y=ground-(boss?137:76);const w=boss?125:75,h=boss?145:85;let kind=boss?'warden':e.id===12||e.id===11||e.id===2?'skeleton':'goblin';ctx.save();ctx.shadowColor=boss?'#12d8ff':'#243c51';ctx.shadowBlur=boss?15:3;const ok=sprite(kind,x-18,y-7,w,h);ctx.restore();if(!ok){ctx.fillStyle='#568a60';ctx.fillRect(x,y,w,h)}ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff2cb';ctx.shadowColor='#000';ctx.shadowBlur=5;ctx.fillText(e.name,x+w/2-18,y-25);ctx.shadowBlur=0;const barw=boss?96:55;ctx.fillStyle='#10192b';ctx.fillRect(x,y-19,barw,7);ctx.fillStyle='#e56b65';ctx.fillRect(x,y-19,barw*e.hp/(e.maxHp||(boss?4:e.id===2?3:2)),7)}function draw(){frame++;camera=Math.max(0,Math.min(world-W,player.x-210));ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.78;if(shake<.3)shake=0}drawSky();drawWorld();enemies.forEach(monster);knight();ctx.restore();if(mode==='walk'){let speed=0;if(keys.left)speed=-4.3;if(keys.right)speed=4.3;if(speed){player.x=Math.max(12,Math.min(world-45,player.x+speed));player.face=Math.sign(speed)}player.vy+=.75;player.y+=player.vy;if(player.y>=ground-player.h){player.y=ground-player.h;player.vy=0;player.grounded=true}const e=nearest();document.getElementById('mission').textContent=e?`⚔️ ${e.name} nearby`:(stage===2?'🌘 The Dark Forest':'🌲 The Forgotten Path')}if(performance.now()>toastTime)toastEl.textContent='';requestAnimationFrame(draw)}function jump(){if(mode==='walk'&&player.grounded){player.vy=-14;player.grounded=false}}function bind(id,down,up){const b=document.getElementById(id);b.addEventListener('contextmenu',ev=>ev.preventDefault());b.addEventListener('selectstart',ev=>ev.preventDefault());b.addEventListener('touchstart',ev=>ev.preventDefault(),{passive:false});b.addEventListener('pointerdown',ev=>{ev.preventDefault();try{b.setPointerCapture(ev.pointerId)}catch{};b.classList.add('pressed');down()});const stop=()=>{b.classList.remove('pressed');if(up)up()};b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('lostpointercapture',stop)}window.addEventListener('blur',()=>{keys.left=false;keys.right=false});document.addEventListener('visibilitychange',()=>{if(document.hidden){keys.left=false;keys.right=false}});bind('left',()=>keys.left=true,()=>keys.left=false);bind('right',()=>keys.right=true,()=>keys.right=false);bind('jump',jump);bind('interact',interact);document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','e','E'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;if((e.key==='ArrowUp'||e.key===' ')&&!e.repeat)jump();if((e.key==='e'||e.key==='E')&&!e.repeat)interact()});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});window.addEventListener('blur',()=>{keys.left=false;keys.right=false});document.getElementById('menuBtn').onclick=()=>{if(mode==='walk'||mode==='victory')levelMenu()};store();intro();requestAnimationFrame(draw)})();
</script></body></html>
